# VENOM - Docker Compose
#
# One command starts the web console:
#
#   docker compose up --build        # -> console http://localhost:8080
#
# The one-shot CLI is opt-in (excluded from a plain `up`):
#
#   docker compose run --rm venom scope --scope examples/scope.json
#   docker compose run --rm venom run   --scope examples/scope.json --in examples/
#
# For LOCAL / AIR-GAPPED LLM, start Ollama alongside it:
#
#   docker compose --profile local up -d ollama
#   docker compose exec ollama ollama pull llama3.1:8b
#   docker compose --profile local run --rm venom providers
#
# Put your real keys in .env (copied from .env.template). The .env file is
# git-ignored and is NOT baked into the image.

name: venom

services:
  # Web console - the VENOM UI over the real engine. Requires login; launching an
  # engagement runs a real, scope-guarded hunt against the authorized target URL you
  # enter. An LLM provider is required (set it in .env).
  venom-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: venom-agent:0.1.0
    entrypoint: ["venom"]
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - ./venom_data:/data                  # persisted run artifacts + engagement rows

  # CLI helper — opt-in (runs once and exits, so it is excluded from `up`).
  # Use it via:  docker compose run --rm venom <args>
  venom:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
    image: venom-agent:0.1.0
    env_file:
      # Optional — VENOM runs offline (playbooks only) if .env is absent.
      - path: .env
        required: false
    environment:
      # In-compose, reach the Ollama service by its DNS name, not localhost.
      OLLAMA_BASE_URL: "http://ollama:11434/api/chat"
    volumes:
      - ./venom_data:/data                 # reports + engagement artifacts (writable)
      - ./examples:/app/examples:ro         # sample artifacts (read-only)
      - ./engagements:/engagements:ro       # drop your own scope.json + artifacts here
    # CLI default; override per invocation with `docker compose run --rm venom <args>`
    command: ["--help"]

  # Local LLM backend for air-gap / budget modes. Enabled only via profile.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Uncomment to use an NVIDIA GPU for local inference:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_models: